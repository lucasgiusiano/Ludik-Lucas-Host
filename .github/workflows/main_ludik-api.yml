name: Build and Deploy ASP.Net Core - Ludik-Api
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
env:
  AZURE_WEBAPP_NAME: 'Ludik-Api'
  UNIT_TEST_PROJECT_PATH: 'LudikAPI\PruebasUnitarias\PruebasUnitarias.csproj'
  SOLUTION_PATH: 'LudikAPI\LudikAPI.sln'
  WEBAPI_PROJECT_PATH: 'LudikAPI\WebApi\WebApi.csproj'
  DOTNET_VERSION: '8.0.x'
 
jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: windows-latest
 
    steps:
      - name: '1. Checkout Repository'
        uses: actions/checkout@v4
 
      - name: '2. Setup .NET Environment'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
 
      - name: '3. Restore Dependencies'
        run: dotnet restore "${{ env.SOLUTION_PATH }}"
 
      - name: '4. Build Project'
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore
 
      - name: '5. Run Unit Tests ONLY'
        run: dotnet test "${{ env.UNIT_TEST_PROJECT_PATH }}" --configuration Release --no-build --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Server=dummy;Database=dummy;User=dummy;Password=dummy;"
          ConnectionStrings__AzureStorage: "DefaultEndpointsProtocol=https;AccountName=dummy;AccountKey=dummykey==;EndpointSuffix=core.windows.net"
          Jwt__SecretKey: "a_dummy_but_long_and_secret_key_for_ci_tests_1234567890"
 
      - name: '6. Publish Application'
        run: dotnet publish "${{ env.WEBAPI_PROJECT_PATH }}" --configuration Release --no-build --output "${{ github.workspace }}/myapp"
 
      - name: '7. Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F633EB439A28468DAB40E73F22F69562 }}
          package: '${{ github.workspace }}/myapp'
 
      - name: '8. Run EF Core Migrations'
        run: |
          # Instala la herramienta de línea de comandos de Entity Framework en el runner de GitHub
          dotnet tool install --global dotnet-ef
         
          # Ejecuta el comando para aplicar las migraciones a la base de datos de Azure
          dotnet ef database update --project "LudikAPI/AccesoDatos/AccesoDatos.csproj" --startup-project "${{ env.WEBAPI_PROJECT_PATH }}"
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
