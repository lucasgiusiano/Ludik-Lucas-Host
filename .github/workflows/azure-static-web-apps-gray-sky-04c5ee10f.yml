name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_FLOWER_06134A60F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # usado para PR comments
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/ludikclient"   # ruta de tu front
          api_location: "/ludikApi"      # mantener igual que cuando creaste la SWA
          output_location: "build"       # carpeta de build de React
          ###### End of Repository/Build Configurations ######
        env:
          REACT_APP_API_URL: ${{ secrets.PRODUCTION_API_URL }} # inyecta la URL de la API en build

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_FLOWER_06134A60F }}
          action: "close"

